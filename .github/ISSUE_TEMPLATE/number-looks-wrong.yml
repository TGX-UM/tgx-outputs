name: A number looks wrong
description: The most valuable kind of report. Every figure links to its own data.
labels: ["data-quality"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, it may be worth checking
        [what we deliberately do not show](https://tgx-um.github.io/tgx-outputs/not-shown/)
        and the [methodology page](https://tgx-um.github.io/tgx-outputs/methodology/),
        which gives the exact query behind every figure.
  - type: input
    id: figure
    attributes:
      label: Which figure or number?
      placeholder: "Overview → Published, and open"
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and why?
      description: If you have a source that disagrees, link it.
    validations: {required: true}
  - type: textarea
    id: csv
    attributes:
      label: Anything odd in the CSV behind it?
      description: Every caption has a "download CSV" link. Optional, but it usually settles the question.
