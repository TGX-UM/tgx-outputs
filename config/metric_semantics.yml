# config/metric_semantics.yml -- what every number counts.
#
# A hard render gate: nothing appears on the site without an entry here, and the
# methodology page is generated from this file, so a definition cannot drift from the
# figure it describes.
#
#   cumulative: true  = a running total with no period. It may never carry a period
#                       label; a level does not belong to a month.
#   caveat            = what the number does not mean. Shown under every figure.

metrics:
  bioc_downloads_monthly:
    label: Bioconductor downloads per month
    counts: Downloads recorded by Bioconductor for a package in a month.
    source: bioconductor
    cumulative: false
    granularity: month
    caveat: Includes CI runs, mirrors and container builds. Read the distinct-IP series instead.
      The current month is incomplete and is not plotted.
  bioc_distinct_ips_monthly:
    label: Bioconductor distinct IPs per month
    counts: Distinct IP addresses downloading a package in a month.
    source: bioconductor
    cumulative: false
    granularity: month
    caveat: 'Closer to people than raw downloads, though it still is not a user count:
      everyone behind one institutional network collapses into a single address.'
  bioc_rank:
    label: Bioconductor download rank
    counts: Position in Bioconductor's published download score table.
    source: bioconductor
    cumulative: true
    granularity: none
    caveat: Worth showing because it comes with a denominator.
  package_downloads_total:
    label: Registry downloads, all time
    counts: The registry's own lifetime download counter, for registries that publish one.
    source: ecosystems
    cumulative: true
    granularity: none
    caveat: 'A running total, never plotted per period. Only Bioconductor and CRAN publish
      a lifetime figure: npm and PyPI report a rolling 30-day count instead, which is a
      different measure and is kept in its own series rather than added to this one.'
  package_downloads_recent:
    label: Registry downloads, last 30 days
    counts: Downloads in the last 30 days, as reported by registries that publish no lifetime
      counter.
    source: ecosystems
    cumulative: false
    granularity: none
    caveat: 'A rolling window, not a total, and it moves in both directions: a quiet month
      is lower than a busy one and that is not an error. Never added to the all-time figures
      above, which count a different thing over a different period.'
  registry_breadth:
    label: Registries published to
    counts: Distinct registries carrying an artefact built from a department repository.
    source: ecosystems
    cumulative: true
    granularity: none
    caveat: Says how many registries carry the software, not how much of it anyone
      downloads. Found by reverse lookup from the repository URL.
  releases_by_year:
    label: Releases per year
    counts: A tagged release of a project's repositories, from GitHub Releases and git tags.
    source: github
    cumulative: false
    granularity: year
    caveat: Tags count too. BridgeDb ships as a tag and BridgeDbR ships through Bioconductor,
      so a Releases-only count misses them.
  repos_active:
    label: Repositories active in the last year
    counts: A project's repositories pushed to in the last 365 days.
    source: github
    cumulative: true
    granularity: none
    caveat: A quiet repository is not a dead one. A finished tool needs no commits.
  rsd_mentions:
    label: Papers mentioning the software
    counts: Works the Research Software Directory records as mentioning a tool.
    source: rsd
    cumulative: true
    granularity: none
    caveat: Computed by the NL eScience Center rather than here. It counts a tool being
      named in a paper's text, which is a much weaker signal than a citation, and it misses
      software that was used without being named at all.
  docker_pulls_total:
    label: Container pulls, all time
    counts: Docker Hub's lifetime pull counter for an image.
    source: dockerhub
    cumulative: true
    granularity: none
    caveat: One pull is not one user. A CI job rebuilding hourly pulls the base image every
      time, and a single pull of a multi-arch image can register more than once. Images
      published only to other registries are missing from this chart.
  latest_release:
    label: Last release
    counts: The date of a project's most recent release or tag.
    source: github
    cumulative: true
    granularity: none
    caveat: Old is not the same as abandoned. ArrayAnalysis has not moved since 2013 and is
      still cited.
  species_served:
    label: Species served
    counts: Species the live BridgeDb webservice can map identifiers for.
    source: services
    cumulative: true
    granularity: none
    caveat: Coverage of the running service, which can lag the mapping databases
      published for download.
  mapping_databases:
    label: Mapping databases published
    counts: Per-species BridgeDb mapping files listed in the public manifest.
    source: services
    cumulative: true
    granularity: none
    caveat: Built by the department from the primary databases, so these are department
      output rather than a third party's data.
  dataset_downloads:
    label: Dataset downloads
    counts: Unique downloads of the department's deposited datasets, summed per project.
    source: services
    cumulative: true
    granularity: none
    caveat: Read per record by DOI. The same figures taken from Zenodo's search listing
      are version-dependent and move between runs, so they are not used.
  services_run:
    label: Services running
    counts: Public web services and sites listed against a project.
    source: services
    cumulative: true
    granularity: none
    caveat: Counts what the department operates. Whether any of it answered today is a
      different job at a different cadence and is not measured here.
  paper_citations:
    label: Citations of the tool's papers
    counts: Citations to every paper describing a tool, summed across its update papers.
    source: citations
    cumulative: true
    granularity: none
    caveat: Citing a software paper is not proof the software was used, and these are
      lifetime counts, so a 2003 paper reflects twenty years. Several of these tools are
      built by communities far larger than this department, and their citations belong
      to those communities too.
  paper_citations_by_doi:
    label: Citations per paper
    counts: Citations to one paper, from OpenAlex.
    source: citations
    cumulative: true
    granularity: none
    caveat: Every update paper is counted, because people cite whichever was current
      when they did the work.
