# config/projects.yml -- the things this dashboard tracks.
#
# ADDING A PROJECT
# ----------------
# Copy a block below, change the values, open a pull request. No code changes and no
# Python needed. Every field except `id`, `name` and `what` is optional: leave out what
# the project does not have, and nothing about it will be shown.
#
#   id        short slug, lowercase, used in URLs and file names
#   name      how it is written on the page
#   what      one sentence a stranger would understand. Shown under the name
#   repos     owner/name on GitHub. Gives releases, tags and last activity
#   packages  registry/name. Gives downloads and the latest version.
#             Registries: bioconductor.org, pypi.org, npmjs.org, cran.r-project.org,
#             repo1.maven.org (use group:artifact), conda-forge.org
#   docker    Docker Hub namespace/image. Gives pull counts
#   ghcr      GitHub Container Registry owner/image. Gives tags published, not pulls,
#             because GHCR reports no pull count anywhere. Private images are skipped
#   rsd       Research Software Directory slug. Gives papers mentioning the tool.
#             Find it in the URL: research-software-directory.org/software/<slug>
#             Not registered there? Register it -- that is worth more than adding it here
#   services  live web services and sites the department runs for this project.
#             Each needs `name`, `url` and `what`. Shown under the project
#   probes    measurable things about those services. Each key is a probe type:
#               bridgedb_contents  the BridgeDb /contents route; counts species served
#               bridgedb_manifest  data.bridgedb.org/gene.json; counts the mapping
#                                  databases published and their Zenodo downloads
#             Adding a new probe type does need code. Adding a URL to an existing one
#             does not
#   papers    DOIs of the papers that describe this tool, the ones people cite when
#             they use it. Citation counts come from OpenAlex. List every update
#             paper: WikiPathways has six, and only counting the newest would
#             understate it several-fold
#   mark      two or three letters for the tile on the front page, when the initials
#             of `name` are not what you would write yourself. Optional
#   logo      a file in docs/assets/images/logos/, drawn on the tile instead of the
#             letters. Vendored like the fonts -- never a URL, and only where the
#             licence allows it. Optional
#   links     shown next to the project. Any label you like
#
# If you are unsure whether an identifier is right, run `tgx doctor --projects`. It
# checks every one of them against the live APIs and tells you which do not resolve.

projects:

  - id: bridgedb
    mark: BD
    name: BridgeDb
    what: >-
      Maps identifiers between biological databases, so that one gene or metabolite
      can be recognised across resources that each name it differently.
    repos: [bridgedb/BridgeDb, bridgedb/bridgedbjs, bridgedb/docker]
    packages:
      - bioconductor.org/BridgeDbR
      - npmjs.org/bridgedb
      - repo1.maven.org/org.bridgedb:org.bridgedb.bio
    papers:
      - 10.1186/1471-2105-11-5              # BridgeDb framework, BMC Bioinformatics 2010
      - 10.12688/f1000research.4521.1       # BridgeDb app for Cytoscape, 2014
    docker: [bigcatum/bridgedb]
    rsd: [bridgedb-java, bridgedb-webservice, bridgedbr]
    services:
      - name: BridgeDb webservice
        url: https://webservice.bridgedb.org
        what: Live identifier mapping over HTTP, for anything that cannot ship a database.
      - name: Mapping databases
        url: https://data.bridgedb.org
        what: >-
          Per-species mapping files, rebuilt from the primary databases and deposited
          with a DOI. These are department output, not a third party's data.
    probes:
      bridgedb_contents: https://webservice.bridgedb.org/contents
      bridgedb_manifest: https://data.bridgedb.org/gene.json
    links:
      site: https://www.bridgedb.org
      Docker Hub: https://hub.docker.com/r/bigcatum/bridgedb

  - id: wikipathways
    logo: wikipathways.svg
    mark: WP
    name: WikiPathways
    what: >-
      An open, community-curated pathway database. The department maintains its
      semantic layer and the clients most people actually use.
    repos:
      - wikipathways/rWikiPathways
      - wikipathways/pywikipathways
      - wikipathways/pvjs
      - wikipathways/wikipathways-database
    packages:
      - bioconductor.org/rWikiPathways
      - pypi.org/pywikipathways
      - npmjs.org/@wikipathways/pvjs
    papers:
      - 10.1371/journal.pbio.0060184        # Pathway editing for the people, PLoS Biol 2008
      - 10.1093/nar/gkr1074                 # NAR 2012
      - 10.1093/nar/gkv1024                 # NAR 2016
      - 10.1093/nar/gkx1064                 # NAR 2018
      - 10.1093/nar/gkaa1024                # NAR 2021
      - 10.1093/nar/gkad960                 # NAR 2024
      - 10.1371/journal.pone.0006447        # Web services, PLoS ONE 2009
    rsd: [rwikipathways]
    services:
      - name: WikiPathways SPARQL endpoint
        url: https://sparql.wikipathways.org
        what: >-
          The RDF layer the department builds from the pathway content and serves as
          queryable linked data. The pathways themselves are curated by the community.
      - name: wikipathways.org
        url: https://www.wikipathways.org
        what: The pathway database itself, which the department co-founded and helps run.
    links:
      site: https://www.wikipathways.org
      Bioconductor: https://bioconductor.org/packages/rWikiPathways
      PyPI: https://pypi.org/project/pywikipathways/
      npm: https://www.npmjs.com/package/@wikipathways/pvjs

  - id: pathvisio
    logo: pathvisio.png
    mark: PV
    name: PathVisio
    what: Desktop editor for biological pathways, and the origin of the GPML format.
    repos: [PathVisio/pathvisio]
    papers:
      - 10.1186/1471-2105-9-399             # PathVisio, BMC Bioinformatics 2008
      - 10.1371/journal.pcbi.1004085        # PathVisio 3, PLoS Comput Biol 2015
    rsd: [pathvisio, libgpml]
    links:
      site: https://pathvisio.org

  - id: cdk
    logo: cdk.png
    mark: CDK
    name: Chemistry Development Kit
    what: >-
      Java library for cheminformatics: structure handling, fingerprints, descriptors.
      Widely used well beyond this department.
    repos: [cdk/cdk]
    packages:
      - repo1.maven.org/org.openscience.cdk:cdk-bundle
    papers:
      - 10.1021/ci025584y                   # CDK, J Chem Inf Comput Sci 2003
      - 10.2174/138161206777585274          # CDK recent developments, 2006
      - 10.1186/s13321-017-0220-4           # CDK v2.0, J Cheminform 2017
    rsd: [cdk]
    links:
      site: https://cdk.github.io

  - id: bacting
    mark: BA
    name: Bacting
    what: Scriptable cheminformatics and bioinformatics, usable from Java and Python.
    repos: [egonw/bacting, egonw/pybacting]
    packages:
      - pypi.org/pybacting
      - repo1.maven.org/io.github.egonw.bacting:managers-cheminfo
    papers:
      - 10.21105/joss.02558                 # Bacting, JOSS 2021
    rsd: [bacting, pybacting]

  - id: arrayanalysis
    mark: AA
    name: ArrayAnalysis
    what: >-
      Transcriptomics analysis workflows and quality control for microarray and
      RNA-seq data.
    repos: [BiGCAT-UM/ArrayAnalysis]
    papers:
      - 10.1093/nar/gkt293                  # ArrayAnalysis.org, NAR 2013
    rsd: [arrayanalysis]
    links:
      site: https://www.arrayanalysis.org
      preprint: https://www.biorxiv.org/content/10.64898/2026.07.13.738193v1

  - id: r-odaf
    mark: RO
    name: R-ODAF
    what: >-
      Reproducible RNA-seq differential expression analysis, packaged as a Shiny app
      for regulatory toxicogenomics.
    repos: [TGX-UM/R-ODAF-Shiny]
    papers:
      - 10.1016/j.yrtph.2022.105143         # R-ODAF, Regul Toxicol Pharmacol 2022
      - 10.1016/j.yrtph.2020.104621         # Towards an omics data analysis framework, 2020
    services:
      - name: R-ODAF
        url: https://r-odaf.nl
        what: The analysis app, hosted so it can be used without installing anything.
    links:
      site: https://r-odaf.nl
      source: https://github.com/TGX-UM/R-ODAF-Shiny

  - id: vhp
    logo: vhp.svg
    mark: VHP
    name: Virtual Human Platform
    what: >-
      The VHP4Safety portal: a single entry point to the chemical safety assessment
      services the consortium runs.
    repos: [VHP4Safety/virtual-human-platform]
    papers:
      - 10.14573/altex.2407211              # The Virtual Human Platform, ALTEX 2024
    rsd: [virtual-human-platform]
    services:
      - name: VHP4Safety platform
        url: https://platform.vhp4safety.nl
        what: One entry point to the chemical safety services the consortium runs.

  - id: aopwiki-rdf
    logo: aopwiki-rdf.png
    mark: AW
    name: AOP-Wiki RDF
    what: >-
      Converts the AOP-Wiki to RDF, versions every release as its own named graph, and
      serves it over a public SPARQL endpoint with a query interface and dashboard.
    repos:
      - marvinm2/AOPWikiRDF
      - marvinm2/AOP-Wiki-Snorql-UI
      - marvinm2/AOP-Wiki-RDF-dashboard
    ghcr:
      - marvinm2/aopwiki-dashboard
      - marvinm2/aop-wiki-snorql-ui
    services:
      - name: AOP-Wiki SPARQL endpoint
        url: https://aopwiki.rdf.bigcat-bioinformatics.org/sparql
        what: The AOP-Wiki as queryable RDF, one named graph per release.
      - name: AOP-Wiki RDF dashboard
        url: https://aopwiki-dashboard.vhp4safety.nl
        what: Charts of the RDF, every one showing the SPARQL query behind it.
    papers:
      - 10.1089/aivt.2021.0010              # AOP-Wiki RDF, Appl In Vitro Toxicol 2022
      - 10.14573/altex.2307131              # Why AOPs need to be FAIR, ALTEX 2023
    links:
      SNORQL query interface: https://aopwiki.rdf.bigcat-bioinformatics.org/

  - id: molaop
    mark: MA
    name: molAOP Builder and Analyser
    what: >-
      Maps Adverse Outcome Pathway key events onto molecular pathways, and analyses
      the resulting molecular AOPs.
    repos: [marvinm2/molAOP-builder, marvinm2/molAOP-analyser]
    ghcr: [marvinm2/molaop-builder, marvinm2/molaop-analyser]
    services:
      - name: molAOP Builder
        url: https://molaop-builder.vhp4safety.nl
        what: Curate key event to pathway mappings, with a confidence assessment.
      - name: molAOP Analyser
        url: https://molaop-analyser.vhp4safety.nl
        what: Analyse the resulting molecular AOPs.
    links:
      preprint: https://doi.org/10.1101/2023.03.02.530766
