# config/sources.yml — the machine-target list for the TGX output dashboard.
#
# NOTHING IN THIS FILE IS PERSONAL DATA. Every target is a repository, a package, an
# image or an endpoint; no person is queried, stored or rendered.
#
# Every entry may carry `note:`; notes are rendered on the methodology page.

meta:
  department: Translational Genomics (TGX)
  institution: Maastricht University
  institution_ror: "https://ror.org/02jz4aj89"
  contact: "marvin.martens@maastrichtuniversity.nl"

# Research Software Directory (NL eScience Center). The tenant is Maastricht
# University-wide, so only slugs named by a project in projects.yml are read.
rsd:
  base: "https://research-software-directory.org/api/v1"
  organisation_id: "34e58775-bba6-48ee-9e0e-d1821cd33108"

# ── COLLECTOR REGISTRY ────────────────────────────────────────────────────────
# Disabling a broken source is a ONE-LINE PR. `cadence` is used by the freshness
# strip to decide when a source is amber (2x) and red (5x).
collectors:
  bioconductor:  {enabled: true,  cadence_days: 7}
  ecosystems:    {enabled: true,  cadence_days: 7}
  github:        {enabled: true,  cadence_days: 7}
  citations:     {enabled: true,  cadence_days: 7}
  dockerhub:     {enabled: true,  cadence_days: 7}
  services:      {enabled: true,  cadence_days: 7}
  rsd:           {enabled: true,  cadence_days: 7}
  wikipathways:  {enabled: false, cadence_days: 7}   # community content, not TGX output
